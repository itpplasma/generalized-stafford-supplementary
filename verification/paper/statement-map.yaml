# Statement map: paper environments and proof steps -> Lean declarations of
# itpplasma/generalized-stafford-formal at the commit `pin`.
#
# Checked by scripts/check_statement_map.py (`make check`), which prints every
# declaration at `pin` and compares the sha256 of the printed text with the
# value recorded here. The printed text of a declaration is its type; for a
# declaration of GeneralizedStaffordChallenge.lean it also includes the full
# definitions (types and bodies) of every challenge-file constant the type
# refers to, transitively, so a changed statement definition changes the hash.
#
# Moving the pin: set `pin`, run `scripts/check_statement_map.py --update`,
# and re-audit the paper paragraphs of every entry whose hash changed
# (AGENTS.md of generalized-stafford, synchronization rule 9).
#
# Fields: `label` is the paper \label; `kind` the LaTeX environment;
# `cite` gives the source of a result quoted from the literature;
# `challenge` lists compared statements of GeneralizedStaffordChallenge.lean,
# `library` the library theorems that prove them, and `algebraic_analysis`
# declarations of the AlgebraicAnalysis dependency at the revision that the
# pin's lake-manifest.json resolves (hashed like library declarations). Every
# statement of ours must map to Lean; an entry without a faithful counterpart
# has `status: missing` and a `missing:` description, and fails the check
# until the statement is formalized.

