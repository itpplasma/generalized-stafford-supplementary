# Neutral proof-step labels (rule 5): a reorganized proof on either side
# shows up as a broken mapping.
proof_steps:
  - step: select
    title: Lemma select, choice of x + H t satisfying finitely many germ tests
    library:
      - {name: GeneralizedStafford.GermTest.exists_affine_satisfied, sha256: 9b8791ba47636a82809862631ae7b1b0d4b989eeed2053e506418b934cb35114}
  - step: select-steps-1-2
    title: Lemma select, Steps 1 and 2 (an H making every map injective)
    library:
      - {name: GeneralizedStafford.exists_affine_direction_of_goldie, sha256: 4c9d74cce72da9e7c96f682c1c844925c174781309232be4b0bb245ae906a81d}
  - step: select-step-1
    title: Lemma select, Step 1 (one H_0 for all pairs, by induction on the pairs)
    algebraic_analysis:
      - {name: AlgebraicAnalysis.TorsionEscape.exists_simultaneously_injective, sha256: 23fb1b46ae49a13ecc85c85c4d7e50c9cda684ab7726ec926f1f0f5ea264e95b}
  - step: pencil-stability
    title: an epic germ v stays epic under v + u c for all but finitely many central c
    library:
      - {name: GeneralizedStafford.germ_pencil_finite, sha256: 55feb277fc7714b99c4b70148de1106759ad0dbaa954e818015d7d24152c0173}
  - step: descent-base
    title: proof of Theorem A', base P(N+1)
    library:
      - {name: GeneralizedStafford.idealBound_initial, sha256: 1b92cea01ee49cb055e7f0197800d2304207b2a849e81f6a74a8b11f11a1de6d}
  - step: descent-step
    title: proof of Theorem A', Steps 1-8, P(e+1) implies P(e)
